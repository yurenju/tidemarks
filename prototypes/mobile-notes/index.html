<title>手機上的本文與筆記</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap"
/>
<style>
  /* Layout: a control strip and a 375px phone on the left, the rules being tried on the right; stacks below 900px. Colours are Tidemarks' own tokens. */
  :root {
    --page: #f4eee2;
    --raised: #fbf7ed;
    --sunken: #ede5d6;
    --hair: #e4ddce;
    --firm: #d9d1be;
    --text: #14171c;
    --body: #232833;
    --muted: #585d64;
    --faint: #9aa1ac;
    --tide: #2e4a75;
    --on-tide: #f4eee2;
    --danger: #9a3b2e;
    --indigo: #1b2e4d;
    --ochre: #a4622f;
    --moss: #5f7a4e;
    --soot: #3d4348;
    --stage: #e6dfd1;
    --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #16202b;
      --raised: #1b2733;
      --sunken: #101a24;
      --hair: #27343f;
      --firm: #35424e;
      --text: #f2f1e9;
      --body: #e4e9ec;
      --muted: #a3aeb6;
      --faint: #6e7c88;
      --tide: #7ea6ce;
      --on-tide: #16202b;
      --danger: #e08b7a;
      --indigo: #a9c4de;
      --ochre: #cf8b4e;
      --moss: #8aab72;
      --soot: #9aa4ab;
      --stage: #0c141c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #16202b;
    --raised: #1b2733;
    --sunken: #101a24;
    --hair: #27343f;
    --firm: #35424e;
    --text: #f2f1e9;
    --body: #e4e9ec;
    --muted: #a3aeb6;
    --faint: #6e7c88;
    --tide: #7ea6ce;
    --on-tide: #16202b;
    --danger: #e08b7a;
    --indigo: #a9c4de;
    --ochre: #cf8b4e;
    --moss: #8aab72;
    --soot: #9aa4ab;
    --stage: #0c141c;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--stage);
    color: var(--body);
    font-family: var(--sans);
    margin: 0;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.35rem;
    color: var(--text);
    margin: 0 0 4px;
  }
  .lede {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 16px;
    max-width: 62ch;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    margin-bottom: 18px;
  }
  .ctl {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ctl > span {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--firm);
    border-radius: 8px;
    overflow: hidden;
    background: var(--raised);
    flex-wrap: wrap;
  }
  .seg button {
    font: inherit;
    font-size: 0.85rem;
    border: 0;
    background: none;
    color: var(--body);
    padding: 6px 12px;
    cursor: pointer;
  }
  .seg button + button {
    border-left: 1px solid var(--hair);
  }
  .seg button[aria-pressed="true"] {
    background: var(--tide);
    color: var(--on-tide);
  }
  button:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--tide);
    outline-offset: 2px;
  }
  .stage {
    display: grid;
    grid-template-columns: 375px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .stage {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .explain {
    font-size: 0.9rem;
    line-height: 1.75;
    max-width: 58ch;
    min-width: 0;
  }
  .explain h2 {
    font-family: var(--serif);
    font-size: 1.1rem;
    color: var(--text);
    margin: 0 0 6px;
  }
  .explain h3 {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin: 18px 0 4px;
    font-weight: 500;
  }
  .explain p,
  .explain ul {
    margin: 0 0 8px;
  }
  .explain ul {
    padding-left: 1.2em;
  }

  /* ---- the phone ---- */
  .phone {
    width: 375px;
    max-width: 100%;
    height: 740px;
    border-radius: 34px;
    border: 10px solid #1e2228;
    background: var(--page);
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
  }
  .screen {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .status {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 30px;
    z-index: 50;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    padding: 8px 22px 0;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---- the book ---- */
  .book {
    position: absolute;
    left: 0;
    right: 0;
    top: 30px;
    bottom: 0;
    overflow: hidden;
  }
  .flow {
    position: absolute;
    font-family: var(--serif);
    color: var(--body);
    font-size: 17px;
    line-height: 30px;
  }
  .flow p {
    margin: 0;
    text-indent: 2em;
  }
  .flow h4 {
    margin: 0 0 30px;
    font-size: 19px;
    font-weight: 600;
    color: var(--text);
    text-indent: 0;
  }
  .h .flow {
    left: 24px;
    right: 24px;
    top: 20px;
  }
  .v .flow {
    writing-mode: vertical-rl;
    top: 28px;
    bottom: 28px;
    right: 24px;
  }
  .v .flow h4 {
    margin: 0 0 0 30px;
  }
  .foot {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--faint);
  }
  .mk {
    cursor: pointer;
    text-decoration-line: underline;
    text-decoration-style: wavy;
    text-decoration-thickness: 1.2px;
    text-decoration-color: var(--ink);
    text-underline-offset: 6px;
  }
  .v .mk {
    text-underline-position: right;
    text-underline-offset: 5px;
  }
  .tap-hint {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--page);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* ---- the single-mark page ---- */
  .layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: var(--page);
    display: flex;
    flex-direction: column;
  }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 36px 14px 8px;
    border-bottom: 1px solid var(--hair);
    font-size: 13px;
    color: var(--muted);
    background: var(--raised);
  }
  .bar .ttl {
    color: var(--text);
    font-weight: 500;
    font-size: 14px;
  }
  .bar .x {
    margin-left: auto;
    font: inherit;
    font-size: 18px;
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 6px;
  }
  .tbtn {
    font: inherit;
    font-size: 12.5px;
    background: none;
    border: 0;
    padding: 2px 0;
    color: var(--tide);
    cursor: pointer;
  }
  .tbtn.danger {
    color: var(--danger);
  }
  .single {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  .src {
    position: relative;
    padding: 20px 24px 0;
  }
  .passage {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 30px;
    color: var(--body);
  }
  .passage p {
    margin: 0;
    text-indent: 2em;
  }
  .passage .ctx {
    color: var(--faint);
  }
  .passage .hl {
    background: color-mix(in srgb, var(--ink) 22%, transparent);
  }
  .clip {
    overflow: hidden;
    position: relative;
  }
  .clip.cut {
    mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent);
  }
  .expand {
    display: flex;
    justify-content: center;
    padding: 6px 0 2px;
  }
  .expand button {
    font: inherit;
    font-size: 13px;
    color: var(--tide);
    background: var(--raised);
    border: 1px solid var(--firm);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
  }

  /* separator between passage and note: three shapes x two colours */
  .sep {
    --c: var(--ink);
    margin: 18px 24px 14px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .sep.c-fixed {
    --c: var(--firm);
  }
  .sep i {
    display: none;
  }
  .sep-hair i:first-child {
    display: block;
    flex: 1;
    height: 1px;
    background: var(--c);
  }
  .sep-short i:first-child {
    display: block;
    width: 44px;
    height: 2px;
    border-radius: 1px;
    background: var(--c);
  }
  .sep-dots i {
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--c);
  }
  .sep-band {
    margin: 18px 0 14px;
  }
  .sep-band i:first-child {
    display: block;
    flex: 1;
    height: 8px;
    background: color-mix(in srgb, var(--c) 18%, transparent);
  }
  .sep-band.c-fixed i:first-child {
    background: var(--sunken);
  }
  /* [[Chrome]], reduced */
  .chrome-top,
  .chrome-bot {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 8;
    background: var(--raised);
    font-size: 13px;
  }
  .chrome-top {
    top: 0;
    padding: 38px 14px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--hair);
  }
  .chrome-top .bt {
    color: var(--text);
    font-weight: 500;
  }
  .chrome-top .ic {
    margin-left: auto;
    display: flex;
    gap: 14px;
  }
  .tbtn.strong {
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .chrome-bot {
    bottom: 0;
    padding: 12px 22px 22px;
    border-top: 1px solid var(--hair);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .chrome-bot .track {
    width: 100%;
    height: 3px;
    background: var(--hair);
    border-radius: 2px;
  }
  .chrome-bot .track i {
    display: block;
    height: 100%;
    background: var(--tide);
    border-radius: 2px;
  }
  .chrome-bot .cn {
    color: var(--muted);
    font-size: 12px;
  }
  .meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 24px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 24px;
    flex-wrap: wrap;
  }
  .meta small {
    color: var(--faint);
  }
  .meta .acts {
    margin-left: auto;
    display: flex;
    gap: 14px;
  }
  .confirm {
    color: var(--text);
  }
  .note {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.8;
    color: var(--body);
    padding: 6px 24px 36px;
  }
  .note p {
    margin: 0 0 0.7em;
  }
  .write-cta {
    margin: 8px 24px 36px;
    display: block;
    width: calc(100% - 48px);
    font: inherit;
    font-size: 14px;
    text-align: left;
    color: var(--muted);
    background: none;
    border: 1px dashed var(--firm);
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
  }

  .nav {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-top: 1px solid var(--hair);
    background: var(--raised);
    padding: 8px 14px 22px;
    font-size: 13px;
  }
  .nav button {
    font: inherit;
    background: none;
    border: 0;
    color: var(--tide);
    cursor: pointer;
    padding: 6px 4px;
    justify-self: start;
  }
  .nav button:disabled {
    color: var(--faint);
    cursor: default;
  }
  .nav .r {
    justify-self: end;
  }
  .nav .c {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    justify-self: center;
  }

  .index {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 30px;
    background: var(--raised);
  }
  .index .chap {
    font-family: var(--serif);
    color: var(--text);
    font-size: 15px;
    padding: 14px 20px 8px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--hair);
  }
  .index .chap small {
    font-family: var(--sans);
    color: var(--faint);
    font-size: 12px;
  }
  .index button {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--hair);
    padding: 14px 20px;
    cursor: pointer;
    color: var(--body);
  }
  .index button[aria-current="true"] {
    background: var(--sunken);
  }
  .index .q {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    border-left: 3px solid var(--ink);
    padding-left: 10px;
  }
  .index .n {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    padding-left: 13px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* editing in place: the passage folds to a strip above, the input sits right under it (ADR-0044: near the top) */
  .strip {
    flex: none;
    padding: 10px 24px;
    background: var(--page);
    border-bottom: 1px solid var(--hair);
  }
  .strip .passage {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    border-left: 3px solid var(--ink);
    padding-left: 10px;
  }
  .ed {
    flex: none;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--raised);
  }
  .ed textarea {
    font: inherit;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    height: 170px;
    border: 1px solid var(--firm);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--page);
    color: var(--body);
    resize: none;
  }
  .ed .done {
    align-self: flex-end;
    font: inherit;
    font-size: 14px;
    background: var(--tide);
    color: var(--on-tide);
    border: 0;
    border-radius: 6px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .kbd {
    margin-top: auto;
    height: 300px;
    background: var(--sunken);
    display: grid;
    place-items: center;
    color: var(--faint);
    font-size: 12px;
    border-top: 1px solid var(--hair);
  }
  .toast {
    position: absolute;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--page);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 60;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<div class="wrap">
  <h1>手機上的本文與筆記</h1>
  <p class="lede">
    單則全頁：一則一頁，上面是原文、下面是筆記，整頁一起捲。點書上的波浪線進來，或用上面的「情況」直接跳到那一則。文字是自己寫的一章假書。
  </p>
  <div class="controls">
    <div class="ctl">
      <span>情況（等於在書上點那一段）</span>
      <div class="seg" id="c-case">
        <button data-v="m3">1 只有重點</button><button data-v="m1">2 一句配一段</button
        ><button data-v="m4">3 跨段配長筆記</button><button data-v="m4s">3′ 跨段配短筆記</button
        ><button data-v="idx">從書上打開〈筆記〉</button><button data-v="">回到書</button>
      </div>
    </div>
    <div class="ctl">
      <span>書的排向（筆記那頁一律橫排）</span>
      <div class="seg" id="c-dir">
        <button data-v="h">橫排</button><button data-v="v">直排</button>
      </div>
    </div>
    <div class="ctl">
      <span>原文與筆記之間的分隔</span>
      <div class="seg" id="c-sep">
        <button data-v="hair">細線</button><button data-v="short">短線</button
        ><button data-v="dots">三點</button><button data-v="band">色帶</button>
      </div>
    </div>
    <div class="ctl">
      <span>分隔的顏色</span>
      <div class="seg" id="c-sepc">
        <button data-v="ink">跟重點同色</button><button data-v="fixed">固定色</button>
      </div>
    </div>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="status"><span>9:41</span><span>●●● 82%</span></div>
        <div class="book" id="book">
          <div class="flow" id="flow"></div>
          <div class="foot">第三章　退潮之後</div>
        </div>
        <div id="overlay"></div>
      </div>
    </div>
    <div class="explain" id="explain"></div>
  </div>
</div>

<script>
  const PARAS = [
    "外婆家在海邊，潮水一天退兩次。小時候我以為海是會走路的，早上走到很遠的地方，傍晚又自己走回來，像一個每天出門上工的人。",
    "退潮的時候，泥灘會整片露出來，顏色比天空還暗一點。{m1}外婆說，海退得越遠，留下來的東西就越多，只是大部分的人不會低頭看。{/}她說這句話的時候正在把竹簍裡的蛤蜊倒進水桶，頭也沒有抬。",
    "我花了很多年才懂那句話不是在講蛤蜊。",
    "那年夏天我在泥灘上撿到一枚舊銅錢，邊緣被磨得很圓，中間的方孔塞滿了細沙。{m2}我把它舉起來對著太陽看，光從孔裡穿過去，落在我的手心上，小小的一塊。{/}外婆看了一眼，說那是以前船上的人掉的，叫我收好。",
    "後來我把那枚銅錢放在書桌的抽屜裡，搬了三次家都還在。每次打開抽屜，{m3}都會聞到一點點海的味道{/}，雖然我知道那只是舊木頭的氣味。",
    "外婆過世那年，我回去過一次。堤防加高了，泥灘還在，只是走下去的那道石階被封起來，旁邊立了一塊牌子，寫著潮汐時刻與禁止進入。",
    "{m4}我站在堤防上等退潮。風很大，水退得比記憶裡慢，一開始只是浪頭變矮，後來才看得出岸邊的石頭一顆一顆冒出來，濕的那一面朝著天。{/}",
    "{m4}退到最低的時候，泥灘上有一條一條很淡的線，是水在不同的時間停過的地方。最外面那條幾乎看不見，最裡面那條還是濕的，顏色很深。我想起外婆的話，那些線就是海走過的路，每一條都是它曾經停下來的證據。{/}",
    "{m4}我沒有走下去。我只是站著，一直看到那些線被下一次的潮水重新蓋住，一條接著一條，從最外面開始。{/}天黑以前，泥灘又變回一片平平的水。",
    "回到城裡以後，我開始在讀過的書上劃線。劃得很少，有時候一整本只有兩三處。我不太回頭去看它們，但我知道它們在那裡，像抽屜裡那枚銅錢。",
    "有一次朋友借走了我的一本書，還回來的時候說，你劃的地方都很奇怪，不是重點。我說那些是我停下來的地方。",
  ];
  const LONG4 = [
    "這一段我讀了好幾次。它寫的是等，不是看海。作者把等待拆成好幾個階段：浪頭變矮、石頭冒出來、線出現、線被蓋住，每一段都比上一段慢。",
    "那些「水在不同時間停過的地方」，我第一次讀的時候以為只是景色，後來才發現它在講記憶：最外面的最淡，最裡面的最新，而它們會被下一次的潮水從外面開始蓋掉。",
    "也就是說，最先消失的是最舊的。這跟我自己的經驗不太一樣，我常常覺得最舊的反而留得最久，最近的事情才忘得快。也許兩種都對，只是一個在講海，一個在講人。",
    "「我沒有走下去」這句很重要。石階被封了是理由之一，但我覺得不是全部。走下去就會踩到那些線，而他只想看著它們。",
    "想跟最後一段那句「那些是我停下來的地方」放在一起讀。劃線也是一種潮痕：書不會記得你在哪裡停過，只有那條線記得。",
  ];
  const MARKS = {
    m1: {
      ink: "indigo",
      age: "昨天",
      md: "10/7",
      note: [
        "小時候以為這是在講撿東西的技巧。現在讀起來比較像在講注意力：東西一直都在，差別只在有沒有人停下來看。外婆一輩子都在低頭看，所以她撿得到。",
      ],
    },
    m2: {
      ink: "moss",
      age: "兩週前",
      md: "9/24",
      note: ["光穿過方孔的那一塊，後來我一直記得形狀。"],
    },
    m3: { ink: "indigo", age: "三天前", md: "10/5", note: [] },
    m4: { ink: "ochre", age: "上個月", md: "9/12", note: LONG4 },
  };
  const ORDER = ["m1", "m2", "m3", "m4"];
  const CASE_LABEL = { m3: "情況 1", m1: "情況 2", m2: "情況 2（另一則短的）", m4: "情況 3" };

  function markText(id) {
    return PARAS.flatMap((p) =>
      [...p.matchAll(/\{(m\d)\}(.*?)\{\/\}/g)].filter((m) => m[1] === id).map((m) => m[2]),
    );
  }
  function markParas(id) {
    return PARAS.map((p, i) => (p.includes("{" + id + "}") ? i : -1)).filter((i) => i >= 0);
  }
  function inkVar(id) {
    return `var(--${MARKS[id].ink})`;
  }
  function esc(s) {
    return s.replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
    );
  }

  let S = {
    sel: "m4",
    dir: "h",
    short4: false,
    open: false,
    writing: false,
    confirm: false,
    index: false,
    chrome: false,
    sep: "short",
    sepc: "ink",
  };
  try {
    Object.assign(S, JSON.parse(localStorage.getItem("mn-proto-3") || "{}"), {
      writing: false,
      confirm: false,
      index: false,
      open: false,
      chrome: false,
    });
  } catch (e) {}
  function save() {
    try {
      localStorage.setItem(
        "mn-proto-3",
        JSON.stringify({ sel: S.sel, dir: S.dir, short4: S.short4, sep: S.sep, sepc: S.sepc }),
      );
    } catch (e) {}
  }
  function noteOf(id) {
    return id === "m4" && S.short4 ? ["等待被拆成好幾段，一段比一段慢。"] : MARKS[id].note;
  }

  const $ = (s) => document.querySelector(s);
  const screen = $("#screen"),
    flow = $("#flow"),
    overlay = $("#overlay");

  function renderBook() {
    screen.className = "screen " + S.dir;
    flow.innerHTML =
      `<h4>第三章　退潮之後</h4>` +
      PARAS.map(
        (p) =>
          `<p>${p.replace(
            /\{(m\d)\}(.*?)\{\/\}/g,
            (_, id, t) =>
              `<span class="mk" data-id="${id}" style="--ink:${inkVar(id)}">${t}</span>`,
          )}</p>`,
      ).join("");
  }

  // The mark's own paragraphs; text in them that is not the mark is dimmed.
  function passageHTML(id) {
    return markParas(id)
      .map(
        (i) =>
          `<p>${PARAS[i]
            .replace(/\{(m\d)\}(.*?)\{\/\}/g, (_, mid, t) => (mid === id ? `\u0000${t}\u0001` : t))
            .split(/(\u0000.*?\u0001)/)
            .map((s) =>
              s.startsWith("\u0000")
                ? `<span class="hl">${s.slice(1, -1)}</span>`
                : s
                  ? `<span class="ctx">${s}</span>`
                  : "",
            )
            .join("")}</p>`,
      )
      .join("");
  }

  function render() {
    save();
    document.querySelectorAll(".seg button").forEach((b) => {
      const k = b.parentElement.id;
      const v =
        k === "c-dir"
          ? S.dir
          : k === "c-sep"
            ? S.sep
            : k === "c-sepc"
              ? S.sepc
              : S.index
                ? "idx"
                : S.sel
                  ? S.sel === "m4" && S.short4
                    ? "m4s"
                    : S.sel
                  : "";
      b.setAttribute("aria-pressed", String(b.dataset.v === v));
    });
    renderBook();
    overlay.innerHTML = "";
    explain();
    if (S.index) return viewIndex();
    if (!S.sel) {
      overlay.innerHTML = S.chrome
        ? chromeHTML()
        : `<div class="tap-hint">點波浪線看那一則；點別處叫出 chrome</div>`;
      return;
    }
    if (S.writing) return viewWrite();
    viewSingle();
  }

  // [[Chrome]] in its [[Find]] state, reduced to what matters here: the top row's 筆記 opens the index.
  function chromeHTML() {
    return `<div class="chrome-top"><button class="tbtn" data-act="noop">‹ 書架</button><span class="bt">潮線</span>
      <span class="ic"><button class="tbtn" data-act="noop">目錄</button><button class="tbtn strong" data-act="index">筆記</button><button class="tbtn" data-act="noop">排版</button></span></div>
    <div class="chrome-bot"><div class="track"><i style="width:38%"></i></div><div class="cn">第三章　退潮之後</div></div>`;
  }

  function viewIndex() {
    overlay.innerHTML = `<div class="layer"><div class="bar"><span class="ttl">筆記</span><button class="x" data-act="close" aria-label="回到書">✕</button></div>
    <div class="index"><div class="chap"><span>第三章　退潮之後</span><small>4 則</small></div>
    ${ORDER.map(
      (
        id,
      ) => `<button data-go="${id}" aria-current="${id === S.sel}" style="--ink:${inkVar(id)}"><div class="q">${esc(markText(id).join(""))}</div>
      <div class="n">${noteOf(id).length ? esc(noteOf(id)[0]) : "只劃了重點"}</div></button>`,
    ).join("")}</div></div>`;
  }

  function viewSingle() {
    const id = S.sel,
      i = ORDER.indexOf(id),
      vert = S.dir === "v",
      note = noteOf(id),
      has = note.length > 0;
    const meta = S.confirm
      ? `<div class="meta confirm"><span>${has ? "刪掉這段重點和筆記？" : "刪掉這段重點？"}</span><span class="acts">
        <button class="tbtn danger" data-act="del-yes">刪除</button><button class="tbtn" data-act="del-no" id="cancel">取消</button></span></div>`
      : `<div class="meta"><span>${MARKS[id].age} <small>${MARKS[id].md}</small></span><span class="acts">
        ${has ? `<button class="tbtn" data-act="edit">編輯</button>` : ""}<button class="tbtn" data-act="del">刪除</button></span></div>`;
    overlay.innerHTML = `<div class="layer" style="--ink:${inkVar(id)}">
    <div class="bar"><span>第三章　退潮之後</span><button class="tbtn" data-act="jump" style="margin-left:auto">在書裡打開</button><button class="x" data-act="close" aria-label="回到書" style="margin-left:4px">✕</button></div>
    <div class="single" id="single">
      <div class="src"><div class="clip" id="clip"><div class="passage" id="pass">${passageHTML(id)}</div></div>
        <div class="expand" id="expand" hidden><button data-act="toggle"></button></div></div>
      <div class="sep sep-${S.sep} c-${S.sepc}" aria-hidden="true"><i></i><i></i><i></i></div>
      ${meta}
      ${has ? `<div class="note">${note.map((t) => `<p>${esc(t)}</p>`).join("")}</div>` : `<button class="write-cta" data-act="edit">寫筆記…</button>`}
    </div>
    <div class="nav"><button data-go="${ORDER[i - 1] || ""}" ${i === 0 ? "disabled" : ""}>‹ 上一則</button>
      <button class="c" data-act="index">${i + 1} / ${ORDER.length} · 全部</button>
      <button class="r" data-go="${ORDER[i + 1] || ""}" ${i === ORDER.length - 1 ? "disabled" : ""}>下一則 ›</button></div></div>`;
    if (S.confirm) $("#cancel").focus();
    fitPassage();
  }

  /* The passage takes at most half the screen, whatever the note's length: the note is the point of this page. */
  function fitPassage() {
    const single = $("#single"),
      clip = $("#clip"),
      pass = $("#pass"),
      ex = $("#expand");
    const full = pass.offsetHeight,
      half = Math.round(single.clientHeight * 0.5);
    const tooLong = full > half;
    ex.hidden = !tooLong;
    if (!tooLong) {
      clip.style.maxHeight = "";
      clip.classList.remove("cut");
      return;
    }
    if (S.open) {
      clip.style.maxHeight = "";
      clip.classList.remove("cut");
      ex.firstChild.textContent = "收起原文";
      return;
    }
    const cap = Math.max(30, Math.floor(half / 30) * 30); // cut on a whole line
    clip.style.maxHeight = cap + "px";
    clip.classList.add("cut");
    ex.firstChild.textContent = `展開全文（還有 ${Math.round((full - cap) / 30)} 行）`;
  }

  function viewWrite() {
    const id = S.sel;
    overlay.innerHTML = `<div class="layer" style="--ink:${inkVar(id)}">
    <div class="bar"><span>第三章　退潮之後</span></div>
    <div class="strip"><div class="passage">${esc(markText(id).join(""))}</div></div>
    <div class="ed"><textarea id="ta" aria-label="筆記" placeholder="寫點什麼…">${esc(noteOf(id).join("\n\n"))}</textarea>
      <button class="done" data-act="done">完成</button></div>
    <div class="kbd">鍵盤</div></div>`;
    $("#ta").focus({ preventScroll: true });
  }

  function toast(t) {
    const d = document.createElement("div");
    d.className = "toast";
    d.textContent = t;
    screen.appendChild(d);
    setTimeout(() => d.remove(), 1600);
  }

  screen.addEventListener("click", (e) => {
    const mk = e.target.closest(".flow .mk");
    if (mk && !overlay.querySelector(".layer")) {
      S.sel = mk.dataset.id;
      S.open = false;
      S.chrome = false;
      render();
      return;
    }
    // a tap on the page that is not a mark toggles [[Chrome]]
    if (e.target.closest("#book") && !overlay.querySelector(".layer")) {
      S.chrome = !S.chrome;
      render();
      return;
    }
    const go = e.target.closest("[data-go]");
    if (go && go.dataset.go) {
      S.sel = go.dataset.go;
      S.index = false;
      S.confirm = false;
      S.open = false;
      render();
      return;
    }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "noop") return;
    if (act === "close") {
      S.sel = null;
      S.index = false;
      S.confirm = false;
      S.chrome = false;
    }
    if (act === "jump") {
      toast("跳到書裡這一段（prototype 只回到書）");
      S.sel = null;
    }
    if (act === "toggle") {
      S.open = !S.open;
    }
    if (act === "edit") S.writing = true;
    if (act === "done") {
      const v = $("#ta").value.trim();
      const parts = v ? v.split(/\n\s*\n/) : [];
      if (S.sel === "m4" && S.short4) S.short4 = false;
      MARKS[S.sel].note = parts;
      S.writing = false;
    }
    if (act === "del") S.confirm = true;
    if (act === "del-no") S.confirm = false;
    if (act === "del-yes") {
      S.confirm = false;
      toast("prototype 不真的刪");
    }
    if (act === "index") {
      S.index = true;
      S.chrome = false;
    }
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.confirm) {
      S.confirm = false;
      render();
    }
  });

  document.querySelectorAll(".seg").forEach((seg) =>
    seg.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (seg.id === "c-dir") S.dir = b.dataset.v;
      else if (seg.id === "c-sep") S.sep = b.dataset.v;
      else if (seg.id === "c-sepc") S.sepc = b.dataset.v;
      else if (b.dataset.v === "idx") {
        S.index = true;
        S.sel = null;
        S.chrome = false;
      } else {
        const v = b.dataset.v;
        S.short4 = v === "m4s";
        S.sel = v === "m4s" ? "m4" : v || null;
        S.open = false;
        S.index = false;
      }
      if (seg.id === "c-case") {
        S.confirm = false;
        S.writing = false;
      }
      render();
    }),
  );

  function explain() {
    const now = S.sel
      ? `<p style="color:var(--muted);font-size:.8rem">現在顯示：${S.sel === "m4" && S.short4 ? "情況 3′" : CASE_LABEL[S.sel]}，書是${S.dir === "h" ? "橫排" : "直排"}。</p>`
      : "";
    $("#explain").innerHTML = `<h2>單則全頁</h2>
    <p>一則一頁：上面是重點所在的那幾段原文（書的字體與字級，重點只帶底色、旁邊不畫波浪線，同段裡重點以外的字變淡），一條分隔，底下是日期列與筆記，整頁一起捲。最下面一列：上一則、全部（索引）、下一則。</p>
    ${now}
    <h3>原文最多半個畫面</h3>
    <p>原文超過半個畫面就剪，不看筆記長短：剪在整行上，下緣淡出，底下一顆「展開全文（還有 N 行）」，展開後變成「收起原文」。</p>
    <h3>直排的書</h3>
    <p>書頁照書直排，進到這一頁之後原文與筆記一律橫排。</p>
    <h3>從書裡怎麼到〈筆記〉</h3>
    <p>點書頁上波浪線以外的地方叫出 chrome，頂列的「筆記」打開索引（第一層），點其中一則進到單則（第二層）。點書上的波浪線則直接進第二層，這時候「全部」與 ✕ 是兩條路：「全部」往上一層到索引，✕ 回到書。</p>
    <h3>分隔</h3>
    <p>上面兩組按鈕切換形狀（細線、短線、三點、色帶）與顏色（跟這則重點同色、或固定的紙色線）。</p>
    <h3>寫筆記</h3>
    <p>原文收成最上面一條兩行的引文，輸入框緊接在它底下，鍵盤在最下面。</p>`;
  }
  window.addEventListener("resize", () => {
    if (S.sel && !S.index && !S.writing) fitPassage();
  });
  render();
  document.fonts?.ready.then(() => {
    if (S.sel && !S.index && !S.writing) fitPassage();
  });
</script>
