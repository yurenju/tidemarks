<!doctype html>
<!-- `lang` is set to the reader's interface language before the first render (`lib/i18n.ts`),
     which is what picks the regional Han glyph forms out of the pan-CJK face this app carries.
     The value here is only what the served file says before any of that runs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS reads this and nothing else when a page is added to the home screen: it ignores the
         manifest's icons, and it will not take an SVG. The PNG is the same mark, rendered at
         180 and left square — iOS rounds the corners itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The colour Android paints its own system bar in. It takes whatever surface reaches the top
      edge underneath it, so that the seam between the two disappears: the reader's top bar while
      the chrome is up, and the page itself everywhere else — the shelf, and a book being read
      (docs/specs/reader-chrome-layers/spec.md).

      This literal is the light theme's `--surface-page`, and it is only the value before any
      script runs. Nothing is on screen yet at that moment and nothing has chrome, so the page is
      the right answer for it; `App.tsx` re-reads the token from the resolved theme and the
      chrome's state and writes it here. The manifest's own `theme_color` is a third copy for a
      third moment — install and splash, before this document exists at all.
    -->
    <meta name="theme-color" content="#f4eee2" />
    <!--
      The resolved theme, before the first paint. `App.tsx` owns both of these and re-states them
      from the tokens themselves, but its effect runs a frame too late: until it does, the page
      is drawn in the light theme and — because a PWA window's frame is painted from whatever
      theme-color the document is announcing while it loads — Chromium strokes the window border
      in paper. Reloading the shelf at night left that border white until something else wrote
      the tag again.

      The two literals are the dark theme's `--surface-page` and the light theme's, the same
      value the tag above already carries. They are a bridge and not a second source of truth:
      whatever they say, `App.tsx` overwrites the tag with the token it reads out of the cascade
      as soon as it mounts. A drifted literal here costs one frame of the wrong colour, not a
      wrong colour.
    -->
    <script>
      (function () {
        var chosen;
        try {
          chosen = JSON.parse(localStorage.getItem("tidemarks-settings") || "{}").theme;
        } catch (e) {
          /* Unreadable settings mean the system decides, same as a first visit. */
        }
        if (chosen !== "light" && chosen !== "dark") {
          chosen = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = chosen;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", chosen === "dark" ? "#16202b" : "#f4eee2");
      })();
    </script>
    <title>Tidemarks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
