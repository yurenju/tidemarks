<!doctype html>
<!-- `lang` is set to the reader's interface language before the first render (`lib/i18n.ts`),
     which is what picks the regional Han glyph forms out of the pan-CJK face this app carries.
     The value here is only what the served file says before any of that runs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The colour Android paints its own system bar in, which lands directly above the reader's
      top bar — so it takes the chrome's surface rather than the book's, or the seam between the
      two says nothing (docs/specs/reader-chrome-layers/spec.md).

      This literal is the light theme's `--surface-raised` and it is only the value before any
      script runs; `App.tsx` re-reads the token from the resolved theme and writes it here. The
      manifest's own `theme_color` is a third copy for a third moment — install and splash,
      before this document exists at all.
    -->
    <meta name="theme-color" content="#f0efe6" />
    <title>Tidemarks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
