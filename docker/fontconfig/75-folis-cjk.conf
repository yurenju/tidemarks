<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  Folis's font bindings, ported from frond's docker/fontconfig/75-frond-cjk.conf.

  ## Why this file exists at all

  The image installs fonts-noto-cjk, and for a long time that was taken to be enough:
  "Folis measures behaviour, not glyph geometry, so which face wins does not matter."
  That reasoning was wrong, and issue #25 is the bill for it. The Playwright base image
  also carries WenQuanYi Zen Hei, and unpinned fontconfig resolves serif — and every
  family name the image does not have, which is every name a book or Folis's own stack
  puts ahead of the generic — to it. **WenQuanYi Zen Hei's Han glyphs have no vertical
  advance**: measured in the vertical Japanese book at 18px, 登 advances 0 while り
  advances 20.6, and the same 登 advances 18 laid out horizontally. So every kanji in a
  vertical book was drawn with no advance and the next character landed on top of it, in
  Chromium and in Firefox alike.

  That is not a typographic nicety. It is the text being unreadable, it reached the
  evidence screenshots a pull request was read from, and it cost a long diagnosis that
  went looking for the cause in the book's resources.

  ## What is pinned

  Which face a generic family resolves to, and which regional face (TC / SC / JP) a lang
  selects. Noto CJK is one family whose OTC holds several faces, and Han unification means
  蘭 and 直 are drawn differently in each — leaving that choice to each browser's own
  language matching gives the three engines a chance to disagree for reasons that have
  nothing to do with Folis.

  ===========================================================================
  Order works on two levels, and the two levels run in different directions. Both were
  verified by measurement; do not change them on intuition.
  ===========================================================================

  The first level is the filename. fontconfig processes /etc/fonts/conf.d/ in filename
  order, and configuration processed later can override what came earlier. Two files in
  this environment touch the same generic families:

    60-latin.conf           ships with the base image; routes serif to Noto Serif / DejaVu
    70-fonts-noto-cjk.conf  ships with fonts-noto-cjk; does regional binding, weakly bound

  This file is numbered 75, after both.

  The second level is the rule order inside the file, and it runs counter to intuition:

    mode="prepend" does not insert at the front of the family list, it inserts before the
    value the <test> matched. Every rule here matches the same "serif", so a rule applied
    later is inserted closer to "serif", which means further back.

    Conclusion: an earlier-applied rule has higher priority. Language specialisations have
    to be written before the general rules.

  Getting it backwards is hard to spot: with the general rule first, serif:lang=ja would
  resolve to the general rule's TC, while serif:lang=zh-tw would still look correct
  because it happens to match the general default — one false green covering one real red.
  docker/verify-fonts.sh exists to pin that down at build time.
-->
<fontconfig>

  <!-- ===================================================================
       Japanese
       ===================================================================
       Has to come before the general rules below, or the general rules' TC would beat the
       JP here. The vertical fixture book (草枕) is Japanese, so this is the binding issue
       #25 turns on.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- ===================================================================
       Simplified Chinese
       ===================================================================
       Both zh-cn and zh-hans are listed. Which one a book declares is not ours to decide,
       and listing only one lets the other fall back silently to the general rules — the
       same hole as "leave it to the browser", moved down a level.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- ===================================================================
       Traditional Chinese
       ===================================================================
       The same as the general rules' default, but still listed explicitly: the default is
       there for books that declare no lang, and must not be relied on as the Traditional
       Chinese binding. The day the default changes, this will not change with it.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- ===================================================================
       General rules: the default face when there is no lang information
       ===================================================================
       Has to come after every language specialisation (see the ordering note in the file
       header).

       A book that declares no lang has to have a definite answer, or it falls back to the
       base image's resolution order — which is exactly what this file is here to block.
       Folis is primarily a Traditional Chinese reader, so the default is TC.
  -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

</fontconfig>
